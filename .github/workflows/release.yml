name: Release

on:
  push:
    tags:
      - v*
  # A rehearsal. Everything a tag run does except the two irreversible steps — the registry push
  # and the npm publish — so the parts that only ever executed for real can be exercised against a
  # branch first. `verify` below decides publish/rehearse from the ref alone, not from an input:
  # an input can be set by whoever starts the run, and "only a tag publishes" must not be a choice.
  workflow_dispatch:

# Floor for the whole file; every job narrows or widens from here deliberately.
# Actions are pinned by SHA — see the note in ci.yml for why a tag is not enough.
permissions:
  contents: read

# Two tags pushed close together must not interleave their publishes: the second would race the
# first for `:latest` and for npm's dist-tag. Queue them instead of cancelling — a release that is
# already halfway through pushing an image should finish, not be abandoned mid-registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs first and with no permissions. It decides one thing — may this run publish? — and every
  # job that touches a registry or the release is gated on the answer. Only a tag whose name
  # matches the CLI package version exactly gets `publish=true`; anything else rehearses.
  #
  # Ref values are passed through `env:` rather than interpolated into the script. A `${{ }}` in a
  # `run:` block is substituted before the shell sees it, so a ref name is shell source rather than
  # shell input — and a tag name is chosen by whoever pushes the tag.
  verify:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether this run may publish
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/cli/package.json').version")"

          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$VERSION" ]; then
              echo "::error::git tag '$REF_NAME' does not match package version 'v$VERSION'"
              exit 1
            fi
            PUBLISH=true
          else
            PUBLISH=false
            echo "::notice::Rehearsal — '$REF_NAME' is not a tag, so nothing will be published."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          # 1.2.3-rc.1 is a prerelease; it must not move :latest
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The changelog is the one release input nothing else checks. The tag is checked against
      # package.json, the image against the tag, the tarball against the build — but a version
      # whose notes were never cut, or cut and then left to go stale while the release slipped,
      # publishes silently and cannot be corrected in place afterwards. Runs on a rehearsal too,
      # which is the cheapest way to find out that the section is missing.
      - name: Verify the changelog has a dated section for this version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          ESCAPED="${VERSION//./\\.}"
          if ! ENTRY="$(grep -oE "^## \[$ESCAPED\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md)"; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' section."
            echo "::error::Cut the [Unreleased] section to [$VERSION] before tagging."
            exit 1
          fi

          ENTRY_DATE="${ENTRY##* }"
          TODAY="$(date -u +%F)"
          if [ "$ENTRY_DATE" \> "$TODAY" ]; then
            echo "::error::CHANGELOG.md dates $VERSION as $ENTRY_DATE, which is in the future."
            exit 1
          fi

          AGE=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$ENTRY_DATE" +%s) ) / 86400 ))
          if [ "$AGE" -gt 14 ]; then
            echo "::warning::CHANGELOG.md dates $VERSION as $ENTRY_DATE, $AGE days ago. Stale?"
          fi
          echo "CHANGELOG.md: \`$ENTRY\`" >> "$GITHUB_STEP_SUMMARY"

  # The release exists as a draft for the whole of `gates` below, and is published by `publish` at
  # the very end. Nothing about the draft is visible to a consumer — npm and ghcr.io are what a
  # user installs from, and neither is touched until the suite is green — but it gives the run a
  # place to hang generated notes, and a red gate leaves an unpublished draft behind rather than
  # nothing at all.
  draft:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --generate-notes diffs against the previous tag, which a shallow clone does not have.
          fetch-depth: 0

      # Idempotent: a re-run of a failed release must not fail here on a draft its own first
      # attempt created.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes

  # The whole of CI, against the tagged commit: lint, typecheck, format, audit, both vitest passes,
  # the browser suite, the tarball smoke test and the Docker e2e run. Until this existed a tag push
  # matched neither of ci.yml's triggers, so `git push --follow-tags` published whatever the tag
  # pointed at with nothing having run against it.
  #
  # ci.yml is called rather than copied. A second copy of these jobs would drift from the one the
  # pull requests run, and the entire point of the gate is that a release is held to the same bar a
  # branch is. A local `uses: ./…` always resolves at the caller's ref, so this runs the tag's own
  # workflow definitions and checks out the tag. No `secrets:` block: no job in ci.yml reads one.
  gates:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: [verify, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The bare tag (no `v`) is the one the CLI pulls — see packages/cli/src/start.ts.
      #
      # On a rehearsal `push` is false: both platforms are still built and the ghcr.io login above
      # still runs, so the build and the credentials are exercised and only the layer upload is
      # skipped. Pushing a throwaway tag would test more, and would also leave a package behind in
      # a namespace whose first published artifact is meant to be a real release.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publish == 'true' }}
          tags: |
            ghcr.io/tregismoreira/warehousd:${{ needs.verify.outputs.version }}
            ghcr.io/tregismoreira/warehousd:v${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.prerelease == 'false' && 'ghcr.io/tregismoreira/warehousd:latest' || '' }}

  npm:
    needs: [verify, gates, image]
    runs-on: ubuntu-latest
    # The publishing credential lives on this environment rather than on the repository, and the
    # environment's deployment rule admits only `v*` tags. A repository secret is readable by any
    # job in any workflow on any ref — and NPM_TOKEN has to be an all-packages token until the
    # package exists and Trusted Publishing replaces it. Binding it here is what keeps that window
    # narrow: the token is unreadable from every ref that is not a release tag.
    #
    # Conditional, and it has to be. A job that names an environment whose deployment rule excludes
    # the current ref does not skip — it fails, with "Branch is not allowed to deploy". Naming it
    # unconditionally would mean every rehearsal ended red on the one job it most needs to exercise.
    # An empty string is how a job opts out of an environment entirely; the rehearsal is what
    # confirms this resolves the way it reads, since a malformed value fails the whole run.
    environment: ${{ needs.verify.outputs.publish == 'true' && 'npm-publish' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      # Path filter, not name filter: `warehousd` also matches the private root package.
      - run: pnpm --filter ./packages/cli build

      # Packed before publishing, so the bytes attached to the GitHub Release are this same build
      # and a failure here costs nothing — the registry has not been touched yet.
      - name: Pack the CLI
        working-directory: packages/cli
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error

      # Everything the real publish does except the upload: the manifest, the file list, the
      # bundled size and the dist-tag are all resolved and printed. `--provenance` is left off
      # because generating an attestation means exchanging the OIDC token with the registry, which
      # is not a dry run of anything — the flag's own failure mode (a private repository) is what
      # `verify` and the repository's visibility already decide.
      - name: Rehearse the publish
        if: needs.verify.outputs.publish != 'true'
        env:
          DIST_TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: pnpm --filter ./packages/cli publish --no-git-checks --access public --tag "$DIST_TAG" --dry-run

      # The dist-tag is explicit because npm's default is `latest` whatever the version says: a
      # 0.3.0-rc.1 published without this becomes what a bare `npm i warehousd` installs. The
      # Docker side has always handled the same case, in the `tags:` block above.
      - name: Publish to npm
        if: needs.verify.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: pnpm --filter ./packages/cli publish --no-git-checks --access public --provenance --tag "$DIST_TAG"

      # The step above sends a prerelease to `next`, which is right for every prerelease but the
      # first one: until some version holds `latest`, a bare `npm i warehousd` resolves nothing and
      # fails with ETARGET. The whole package is then uninstallable by its own name, which is a
      # worse first impression than an unqualified install of a release candidate.
      #
      # So `latest` is pointed at this version when, and only when, nothing else holds it. That is
      # self-limiting: it can be true at most once in the package's life, and the moment a stable
      # release exists a later 0.2.0-rc.1 reads a non-empty tag here and goes to `next` alone —
      # the behaviour above, unchanged, with no flag to remember to unset.
      #
      # Read back rather than inferred. npm's own handling of a first publish under a non-`latest`
      # tag is not a thing to bet a release on, and asking the registry what it did is correct
      # whichever way it behaves — and a no-op on a re-run, since by then the tag is set.
      #
      # The image tags deliberately have no equivalent. `warehousd start` pulls
      # `ghcr.io/…/warehousd:<version>` and never `:latest`, so an RC that leaves `:latest` unset
      # breaks nothing; a missing npm `latest` breaks `npx warehousd` outright.
      - name: Point `latest` at the first release, if nothing holds it yet
        if: needs.verify.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT="$(npm view warehousd dist-tags.latest 2>/dev/null || true)"
          if [ -n "$CURRENT" ]; then
            echo "::notice::npm dist-tag \`latest\` is $CURRENT; leaving it alone."
            exit 0
          fi
          echo "::notice::No \`latest\` dist-tag exists; pointing it at $VERSION."
          npm dist-tag add "warehousd@$VERSION" latest
          echo "npm \`latest\` → \`$VERSION\` (first publish)" >> "$GITHUB_STEP_SUMMARY"

  # Last, and only once both registries have the artifacts: the published release is the signal
  # that a version is real, so it must not appear while an image or a tarball is still missing.
  publish:
    needs: [verify, draft, image, npm]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/cli-tarball

      # --clobber so a re-run replaces the asset rather than failing on the name.
      # GitHub excludes a prerelease from "Latest release" on its own, so `--prerelease` is the
      # only flag needed here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP"/cli-tarball/*.tgz --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
