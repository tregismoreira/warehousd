name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: mvp
          file: mvp/apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/warehousd/warehousd:${{ github.ref_name }}
            ghcr.io/warehousd/warehousd:latest

  npm:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        working-directory: mvp
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          PACKAGE_VERSION="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: git tag '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
        working-directory: mvp

      - run: pnpm --filter warehousd build
        working-directory: mvp

      - run: pnpm --filter warehousd publish --no-git-checks --access public
        working-directory: mvp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
