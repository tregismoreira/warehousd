name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: pnpm lint

      - run: pnpm test
        env:
          WAREHOUSD_PROJECT_DIR: examples/meridian

      - run: pnpm build

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: docker build -f apps/web/Dockerfile -t warehousd:ci .

      - run: pnpm --filter warehousd build

      - run: pnpm test:e2e:cli
        env:
          WAREHOUSD_IMAGE: warehousd:ci

      - run: pnpm test:e2e:sso
