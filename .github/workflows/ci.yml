name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml on a tag. A tag matches neither trigger above, so before this the
  # release path ran no gate at all: `git push --follow-tags` went straight to npm and ghcr.io.
  # The `changes` job below classifies anything that is not a pull request as "run everything",
  # and inside a called workflow `github.event_name` is the caller's event — `push`, for a tag —
  # so a release run gets every job with no path filtering.
  workflow_call:

# One run per pull request at a time. Without this, a push that updates several branches at once —
# a stacked pull request being restacked is the ordinary case — starts a run for each branch AND a
# run for each child whose base moved, all on the same commits and all at once. Nothing cancelled
# anything, so they saturated the runner pool and jobs died on a SIGTERM (exit 143) or an
# "operation was canceled" with no failing assertion anywhere in the log. The same commit would
# pass in one run and fail in another, which is the signature to recognise.
#
# `cancel-in-progress` is deliberately false for anything that is not a pull request. A push to
# `main` and a `workflow_call` from release.yml are gates whose result is the record of whether a
# commit is releasable — cancelling one mid-flight would leave a tag with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares its own `permissions` as well. This is the floor: a job that forgets to narrow
# still cannot write. release.yml has done this since it was written (`permissions: {}` on verify);
# ci.yml declared nothing at all, so all five jobs ran with the repository default.
permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag. A tag is mutable — whoever controls the action's
# repository can move `v4` to any commit, and it would then run here with this workflow's token. The
# trailing comment records which release each SHA is, so dependabot can bump both together.
jobs:
  # Which of the jobs below this diff can actually affect. Everything is code until proved
  # otherwise: an unrecognised path turns every job on, so adding a directory can never silently
  # switch a gate off. Getting this wrong in the safe direction costs CI minutes; getting it wrong
  # in the other direction merges an untested change, so the default is deliberately expensive.
  #
  # Jobs are skipped by an `if`, not by `paths-ignore` on the trigger. A workflow that never starts
  # leaves its checks pending forever, and a pending required check blocks the merge it was meant
  # to wave through. A skipped job reports as skipped, which branch protection accepts.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      quality: ${{ steps.classify.outputs.quality }}
      test: ${{ steps.classify.outputs.test }}
      playwright: ${{ steps.classify.outputs.playwright }}
      pack: ${{ steps.classify.outputs.pack }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The classifier diffs against the merge base, which a shallow clone does not have.
          fetch-depth: 0

      - id: classify
        # Context values arrive as environment variables rather than `${{ }}` interpolated into the
        # script. Both of these are commit SHAs and so are harmless, but interpolating *any* context
        # into a `run:` body is how a branch name on a fork pull request becomes shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          quality=false test=false playwright=false pack=false e2e=false
          all() { quality=true; test=true; playwright=true; pack=true; e2e=true; }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            # A push to main or a manual run gets everything. Filtering is an optimisation for
            # review, not for the branch that ships.
            all
          elif ! base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            # No common ancestor to diff against. Run the lot rather than guess.
            all
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                # A `.md` under a seed directory is a fixture the suites index, not prose. This
                # case has to precede the prose one below or every seed document reads as inert.
                examples/*/seed/*) quality=true; test=true; playwright=true; e2e=true ;;
                # Read by people, run by nothing: `.prettierignore` already excludes *.md from
                # `format:check`, and no suite loads any of these.
                *.md|LICENSE) ;;
                # Repository and CI configuration — workflows, dependabot, issue templates,
                # banner assets. Nothing under `.github/` is read by a suite: these files say how
                # the jobs run, not what they prove. That includes this file, which means a change
                # to a job's *steps* is not exercised by the pull request making it. `changes`
                # itself still runs on every pull request and still fails loudly if the classifier
                # below breaks; the steps it gates are proved by the next push to `main`, which is
                # never filtered.
                .github/*) ;;
                # The browser suite never drives the CLI, so a CLI-only change skips it.
                packages/cli/*) quality=true; test=true; pack=true; e2e=true ;;
                # The web app is not in the CLI tarball, so a web-only change skips `pack`.
                apps/web/*) quality=true; test=true; playwright=true; e2e=true ;;
                # The demo project is the fixture every suite runs against — and `seed/live.ts`
                # is linted and type-checked — but it ships in no package.
                examples/*) quality=true; test=true; playwright=true; e2e=true ;;
                # Everything else, `packages/broker/` included. The broker is behind the web app,
                # the CLI and the tarball alike, so there is nothing for it to skip.
                *) all ;;
              esac
            done < <(git diff --name-only "$base" "$HEAD_SHA")
          fi

          {
            echo "| job | runs |"
            echo "| --- | --- |"
            for job in quality test playwright pack e2e; do
              echo "$job=${!job}" >> "$GITHUB_OUTPUT"
              echo "| $job | ${!job} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Quality gates run on their own and before the suite: a lint, type or format failure is seconds
  # of feedback and should not sit behind twenty minutes of Postgres.
  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Covers test/, e2e/ and scripts/ as well as src — see scripts/typecheck.ts. Until this
      # existed, ~16.7k lines of test code were type-checked nowhere and 436 type errors sat behind
      # a green `pnpm test`.
      - run: pnpm typecheck

      - run: pnpm format:check

      # An npx invocation, not a package.json entry: this needs no local install, and adding one
      # would be a dependency the broker (and the rest of the workspace) does not otherwise need.
      - run: npx -y @redocly/cli lint docs/openapi.json

      # --prod: a vulnerability in a dev dependency does not ship. Advisories appear between
      # releases with no code change here, so only high and above fails the job.
      - run: pnpm audit --prod --audit-level high

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      # `pnpm test` plus blob reports merged into one coverage report across both passes; see
      # scripts/run-tests.ts. The threshold check runs on the merged report only, because the serial
      # pass is three suites and a floor against its partial coverage would say nothing.
      - run: pnpm test:coverage
        env:
          WAREHOUSD_PROJECT_DIR: examples/harbor

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              console.log("| metric | % | covered |");
              console.log("| --- | --- | --- |");
              for (const k of ["lines", "statements", "functions", "branches"])
                console.log(`| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: pnpm build

      - if: always()
        run: pnpm test:down

  # Deliberately not `needs: test`, unlike `pack` and `e2e` below. This is the longest job in the
  # workflow, so gating it on the suite put its ~9 minutes *after* the suite's ~4 rather than
  # alongside them, for a 13-minute wait on a green pull request. Nothing here consumes what
  # `test` produces — this job builds its own containers — so the only thing the gate bought was
  # not spending browser minutes on a branch whose unit tests were already red. Feedback latency
  # on the green path is worth more than those minutes. Both jobs still block the merge.
  #
  # Sharded across runners rather than parallelised on one. A shard is a whole machine with its own
  # Postgres, its own `next dev` and its own database, so the specs stay exactly as isolated from
  # each other as they are on one runner — `workers: 1` still holds inside a shard. Splitting them
  # *within* a runner would mean sharing one database and one dev server between workers, which the
  # suite is not written for.
  #
  # Four, and the reason is balance rather than wall clock. About 180s of each shard is fixed cost
  # it cannot share (install, `test:up`, the browser download, `e2e:setup`, the dev server and
  # route warm-up), so on time alone three was right and a fourth shard bought ~24s for another
  # whole runner. What changed is the split: Playwright shards by file, and at three the suite
  # landed 38/42/30, with the 42 heavy enough that the runner was intermittently reclaimed
  # part-way through — reported as `The operation was canceled` or a bare exit 143, with no failing
  # assertion anywhere in the log and the same commit passing on a re-run. Four splits it
  # 30/30/30/23, which puts the heaviest shard back under what was passing before.
  #
  # Watch that balance when adding spec files: two new ones were what pushed a shard from 32 to 42.
  # Check with `playwright test --shard=N/M --list`. Change the denominator in both places below
  # together — the matrix and the `--shard` flag have to agree.
  playwright:
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      # One shard failing must not cancel the others: a red suite should report everything that is
      # wrong in one go, not just whichever file happened to fail first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: pnpm --filter @warehousd/web exec playwright install --with-deps chromium

      # `pnpm e2e` is `e2e:setup && playwright test`, split here so the shard flag reaches the
      # second half. Every shard provisions the whole database: `e2e:setup` is what seeds the
      # personas and grants the specs read, and a shard holding only some of the files still needs
      # all of it.
      - run: pnpm e2e:setup

      # The shard number arrives as an environment variable rather than interpolated into the
      # script body, matching the `changes` job above. It is a literal from the matrix and so is
      # harmless either way, but the habit is what keeps a future context value from becoming
      # shell.
      - run: pnpm --filter @warehousd/web exec playwright test --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}

      - if: always()
        run: pnpm test:down

  # Packaging fidelity: installs the actual tarball outside the workspace, so a broken `bin`
  # path, a missing shebang, a `files` omission, or an unresolvable external `pg` fails here
  # rather than after publishing.
  pack:
    needs: [changes, test]
    if: needs.changes.outputs.pack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./packages/cli build

      - name: Pack the CLI
        working-directory: packages/cli
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - name: Install the tarball and smoke-test it
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "$RUNNER_TEMP/$tarball"
          mkdir -p smoke && cd smoke
          warehousd --version
          warehousd init
          test -f warehousd.yml

  e2e:
    needs: [changes, test]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: docker build -f apps/web/Dockerfile -t warehousd:ci .

      # Path filter, not name filter: `warehousd` also matches the private root package.
      - run: pnpm --filter ./packages/cli build

      - run: pnpm test:e2e:cli
        env:
          WAREHOUSD_IMAGE: warehousd:ci

      - run: pnpm test:e2e:sso

      # This job never ran test:down at all, so its containers leaked between runs — the
      # `playwright` job did and this one was simply missed.
      - if: always()
        run: pnpm test:down
