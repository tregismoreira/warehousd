name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job declares its own `permissions` as well. This is the floor: a job that forgets to narrow
# still cannot write. release.yml has done this since it was written (`permissions: {}` on verify);
# ci.yml declared nothing at all, so all five jobs ran with the repository default.
permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag. A tag is mutable — whoever controls the action's
# repository can move `v4` to any commit, and it would then run here with this workflow's token. The
# trailing comment records which release each SHA is, so dependabot can bump both together.
jobs:
  # Quality gates run on their own and before the suite: a lint, type or format failure is seconds
  # of feedback and should not sit behind twenty minutes of Postgres.
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Covers test/, e2e/ and scripts/ as well as src — see scripts/typecheck.ts. Until this
      # existed, ~16.7k lines of test code were type-checked nowhere and 436 type errors sat behind
      # a green `pnpm test`.
      - run: pnpm typecheck

      - run: pnpm format:check

      # --prod: a vulnerability in a dev dependency does not ship. Advisories appear between
      # releases with no code change here, so only high and above fails the job.
      - run: pnpm audit --prod --audit-level high

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      # `pnpm test` plus blob reports merged into one coverage report across both passes; see
      # scripts/run-tests.ts. The threshold check runs on the merged report only, because the serial
      # pass is three suites and a floor against its partial coverage would say nothing.
      - run: pnpm test:coverage
        env:
          WAREHOUSD_PROJECT_DIR: examples/harbor

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              console.log("| metric | % | covered |");
              console.log("| --- | --- | --- |");
              for (const k of ["lines", "statements", "functions", "branches"])
                console.log(`| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: pnpm build

      - if: always()
        run: pnpm test:down

  playwright:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: pnpm --filter @warehousd/web exec playwright install --with-deps chromium

      - run: pnpm e2e

      - if: always()
        run: pnpm test:down

  # Packaging fidelity: installs the actual tarball outside the workspace, so a broken `bin`
  # path, a missing shebang, a `files` omission, or an unresolvable external `pg` fails here
  # rather than after publishing.
  pack:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./packages/cli build

      - name: Pack the CLI
        working-directory: packages/cli
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - name: Install the tarball and smoke-test it
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "$RUNNER_TEMP/$tarball"
          mkdir -p smoke && cd smoke
          warehousd --version
          warehousd init
          test -f warehousd.yml

  e2e:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: docker build -f apps/web/Dockerfile -t warehousd:ci .

      # Path filter, not name filter: `warehousd` also matches the private root package.
      - run: pnpm --filter ./packages/cli build

      - run: pnpm test:e2e:cli
        env:
          WAREHOUSD_IMAGE: warehousd:ci

      - run: pnpm test:e2e:sso

      # This job never ran test:down at all, so its containers leaked between runs — the
      # `playwright` job did and this one was simply missed.
      - if: always()
        run: pnpm test:down
