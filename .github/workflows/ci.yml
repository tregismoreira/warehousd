name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint runs on its own so a style failure does not sit in front of the test suite.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: pnpm test
        env:
          WAREHOUSD_PROJECT_DIR: examples/harbor

      - run: pnpm build

  playwright:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: pnpm --filter @warehousd/web exec playwright install --with-deps chromium

      - run: pnpm e2e

      - run: pnpm test:down

  # Packaging fidelity: installs the actual tarball outside the workspace, so a broken `bin`
  # path, a missing shebang, a `files` omission, or an unresolvable external `pg` fails here
  # rather than after publishing.
  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./packages/cli build

      - name: Pack the CLI
        working-directory: packages/cli
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - name: Install the tarball and smoke-test it
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g "$RUNNER_TEMP/$tarball"
          mkdir -p smoke && cd smoke
          warehousd --version
          warehousd init
          test -f warehousd.yml

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:up

      - run: docker build -f apps/web/Dockerfile -t warehousd:ci .

      # Path filter, not name filter: `warehousd` also matches the private root package.
      - run: pnpm --filter ./packages/cli build

      - run: pnpm test:e2e:cli
        env:
          WAREHOUSD_IMAGE: warehousd:ci

      - run: pnpm test:e2e:sso
