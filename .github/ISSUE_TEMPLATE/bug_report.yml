name: Bug report
description: Something behaves differently from what the docs say it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        If the bug is that client-supplied input reached SQL other than as a bound parameter, that a
        grant was bypassed, or that a decision went unaudited, **stop and report it privately**
        instead — see SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what happened instead, and where the two diverge.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        Smallest sequence that shows it. The `warehousd.yml` collection definition and the intent or
        request involved are usually the two things that matter.
      render: shell
    validations:
      required: true

  - type: textarea
    id: audit
    attributes:
      label: Relevant audit row, if any
      description: >-
        Every broker decision writes one. `select outcome, reason, intent from app.audit_events
        order by at desc limit 5` — redact values before pasting.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: "`warehousd --version`, or the commit if running from source."
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      multiple: true
      options:
        - MCP (/mcp)
        - REST (/v1/**)
        - Web UI
        - CLI
        - Other / not sure
    validations:
      required: true
