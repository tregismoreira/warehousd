version: 2

updates:
  # Actions are pinned by SHA in the workflows (see the note in ci.yml). Dependabot understands that
  # pinning and rewrites both the SHA and the trailing `# v4` comment, which is the only practical
  # way to keep SHA pins current — pinned-and-stale is its own kind of vulnerable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One entry covers the whole pnpm workspace: `directory: /` reads pnpm-workspace.yaml, so the two
  # packages, the app and the example are all included without listing them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Grouped so a routine week is one PR to review rather than fifteen. Security updates are
      # still raised individually and immediately — that is dependabot's own behaviour and is not
      # affected by grouping.
      #
      # Majors are deliberately outside both groups, so each arrives as its own PR. A group is only
      # as mergeable as its worst member: the dev group once bundled six updates, of which
      # typescript 7 (unsupported by typescript-eslint) and vitest 4 (needs a vite major it did not
      # bring) were both red, and that held @types/node, eslint and commander hostage to two
      # upstream problems they had nothing to do with. The limit above is 10 rather than 5 because
      # unbundling majors means more open PRs in a week that has several.
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned in package.json's `pnpm.overrides` to work around a specific upstream break; a bump
      # here would be silently overridden anyway.
      - dependency-name: better-call

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
